services:
  universal-kmz:
    build:
      context: .
      args:
        GOOGLE_MAPS_BROWSER_KEY: ${GOOGLE_MAPS_BROWSER_KEY:-}
        GOOGLE_MAPS_MAP_ID: ${GOOGLE_MAPS_MAP_ID:-}
    image: leitor-kmz-universal:local
    container_name: leitor-kmz-universal
    environment:
      NODE_ENV: production
      PORT: 3000
      GEOCODER_MODE: ${GEOCODER_MODE:-google}
      GEOCODER_CHAIN: ${GEOCODER_CHAIN:-}
      ALLOW_MOCK_GEOCODER: ${ALLOW_MOCK_GEOCODER:-false}
      GOOGLE_MAPS_SERVER_KEY: ${GOOGLE_MAPS_SERVER_KEY:-}
      LOCATIONIQ_API_KEY: ${LOCATIONIQ_API_KEY:-}
      GEOAPIFY_API_KEY: ${GEOAPIFY_API_KEY:-}
      NOMINATIM_EMAIL: ${NOMINATIM_EMAIL:-}
      CNEFE_DIR: ${CNEFE_DIR:-/app/dados/cnefe}
      CNEFE_MAX_ROWS: ${CNEFE_MAX_ROWS:-3000000}
      VIACEP_VALIDATION: ${VIACEP_VALIDATION:-false}
      GEOCODE_CROSSCHECK: ${GEOCODE_CROSSCHECK:-false}
      GEOCODE_CACHE_DIR: ${GEOCODE_CACHE_DIR:-/app/dados}
      GEOCODE_CACHE_MAX_ITEMS: ${GEOCODE_CACHE_MAX_ITEMS:-50000}
      GOOGLE_MAPS_BROWSER_KEY: ${GOOGLE_MAPS_BROWSER_KEY:-}
      GOOGLE_MAPS_MAP_ID: ${GOOGLE_MAPS_MAP_ID:-}
    ports:
      - "${KMZ_HOST_PORT:-3008}:3000"
    volumes:
      - ./dados:/app/dados
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
