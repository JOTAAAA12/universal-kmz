services:
  universal-kmz:
    build:
      context: .
      args:
        GOOGLE_MAPS_BROWSER_KEY: ${GOOGLE_MAPS_BROWSER_KEY:-}
        GOOGLE_MAPS_MAP_ID: ${GOOGLE_MAPS_MAP_ID:-}
    image: leitor-kmz-universal:local
    container_name: leitor-kmz-universal
    environment:
      NODE_ENV: production
      PORT: 3000
      GEOCODER_MODE: ${GEOCODER_MODE:-google}
      ALLOW_MOCK_GEOCODER: ${ALLOW_MOCK_GEOCODER:-false}
      GOOGLE_MAPS_SERVER_KEY: ${GOOGLE_MAPS_SERVER_KEY:-}
      GOOGLE_MAPS_BROWSER_KEY: ${GOOGLE_MAPS_BROWSER_KEY:-}
      GOOGLE_MAPS_MAP_ID: ${GOOGLE_MAPS_MAP_ID:-}
    ports:
      - "${KMZ_HOST_PORT:-3008}:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
